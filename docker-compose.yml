services:
  postgres:
    image: postgres:16-alpine
    container_name: tutorflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutorflow}
      POSTGRES_USER: ${POSTGRES_USER:-tutorflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutorflow_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-tutorflow} -d ${POSTGRES_DB:-tutorflow}"
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tutorflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: tutorflow-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OAUTHLIB_INSECURE_TRANSPORT=1
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: tutorflow-celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OAUTHLIB_INSECURE_TRANSPORT=1
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: tutorflow-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules: